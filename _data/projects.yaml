- title: Agentic HPC Runtime
  subtitle: Speculative prefetching for agentic HPC workflows
  image: images/agent_runtime_diagram.png
  link: https://github.com/daxdelvira/agent-hpc-runtime
  description: A prediction-driven prefetch runtime that sits between an LLM agent and the HPC resources it needs. After each LLM response it predicts which model weights or data files the next tool call will require, loads them speculatively in the background, and cancels if the agent diverges — overlapping expensive I/O with active computation instead of stalling on it.
  repo: daxdelvira/agent-hpc-runtime
